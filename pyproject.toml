[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gunsnprices"
dynamic = ["version"]
description = "Parse firearm and ammunition product titles: brand, model, caliber, magazine capacity, barrel length, rounds per box."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "LICENSE-DATA"]
authors = [{ name = "GunsNPrices", email = "app@gunsnprices.com" }]
keywords = ["firearms", "guns", "ammunition", "ammo", "caliber", "glock", "title-parsing", "product-matching", "ecommerce", "price-comparison"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: General",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://gunsnprices.com"
Source = "https://github.com/gunsnprices/gunsnprices-python"
Issues = "https://github.com/gunsnprices/gunsnprices-python/issues"
Datasets = "https://huggingface.co/gunsnprices"

[project.scripts]
gunsnprices = "gunsnprices.__main__:main"

[tool.hatch.version]
path = "src/gunsnprices/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gunsnprices"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "LICENSE-DATA", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
